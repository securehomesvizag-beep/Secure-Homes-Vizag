<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" fill="none">
  <defs>
    <!-- Shield Top Gradient: Deep Navy to Cyan/Teal -->
    <linearGradient id="shieldGrad" x1="16" y1="12" x2="76" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#142154"/>
      <stop offset="45%" stop-color="#19407E"/>
      <stop offset="85%" stop-color="#0E8A94"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>

    <!-- Lower Green Swoosh Gradient: Leaf Green to Lime -->
    <linearGradient id="greenSwooshGrad" x1="24" y1="62" x2="80" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="40%" stop-color="#43A047"/>
      <stop offset="85%" stop-color="#68BA31"/>
      <stop offset="100%" stop-color="#84CC16"/>
    </linearGradient>

    <!-- Outer Green Wing Gradient -->
    <linearGradient id="outerWingGrad" x1="40" y1="72" x2="86" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#388E3C"/>
      <stop offset="60%" stop-color="#62B930"/>
      <stop offset="100%" stop-color="#8CD629"/>
    </linearGradient>

    <!-- Bottom Left Navy Swoosh -->
    <linearGradient id="navySwooshGrad" x1="10" y1="46" x2="48" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111B42"/>
      <stop offset="100%" stop-color="#1B3573"/>
    </linearGradient>
  </defs>

  <!-- ==================== SHIELD EMBLEM ==================== -->
  <g id="shield-emblem" transform="translate(4, 2)">
    <!-- Main Upper Shield Body (Navy to Teal) -->
    <path d="M44 8 C36 10 24 13 14 16 C13 26 13 40 18 52 C24 49 32 46 42 42 C56 36 67 29 74 19 C68 14 56 10 44 8 Z" 
          fill="url(#shieldGrad)"/>

    <!-- Inner Shield Depth / House Wall Area -->
    <path d="M16 22 C15 32 16 43 20 50 C26 47 34 44 44 40 C56 35 65 28 71 20 C64 16 54 13 44 11 C34 13 24 17 16 22 Z" 
          fill="#162963" opacity="0.65"/>

    <!-- White Roof with Left Overhang & Right Chimney -->
    <!-- Chimney -->
    <rect x="52" y="19" width="3.5" height="7" fill="#FFFFFF"/>
    <!-- Triangular Overhanging Roof -->
    <path d="M44 14 L20 31.5 L24.5 32.5 L24 35.5 L17 31 L44 14 Z" fill="#FFFFFF"/>
    <path d="M44 14 L62 26 L58 28.5 L44 18.5 L25 33.5 L22.5 30 L44 14 Z" fill="#FFFFFF"/>

    <!-- Two White Square Windows in Dark Wall -->
    <rect x="38" y="27" width="4.5" height="4.5" rx="0.5" fill="#FFFFFF"/>
    <rect x="44.5" y="24" width="4.5" height="4.5" rx="0.5" fill="#FFFFFF"/>

    <!-- Dynamic Base Ribbon / Dark Blue Swoosh on Left -->
    <path d="M9 37 C8 44 12 51 21 55 C29 52 38 48 48 43 C37 46 26 48 18 46 C13 45 10 41 9 37 Z" 
          fill="url(#navySwooshGrad)"/>

    <!-- Main Dynamic Green Swoosh / Lower Shield Crescent -->
    <path d="M12 43 C15 53 23 61 36 65 C48 68 60 62 70 48 C75 40 78 30 79 21 C77 28 72 38 65 47 C55 58 45 62 35 60 C24 57 16 51 12 43 Z" 
          fill="url(#greenSwooshGrad)"/>

    <!-- Outer Right Green Accent Wing -->
    <path d="M29 64 C38 69 49 70 59 63 C69 56 76 43 80 29 C81 22 81 18 81 17 C80 23 78 33 72 43 C65 54 55 61 45 62 C39 63 34 63 29 64 Z" 
          fill="url(#outerWingGrad)"/>
  </g>

  <!-- ==================== BRAND TYPOGRAPHY ==================== -->
  <g id="brand-text" transform="translate(98, 0)">
    <!-- "SecureHome" -->
    <text x="0" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5px">
      <tspan fill="#1D3977">Secure</tspan>
      <tspan fill="#4CA82B">Home</tspan>
    </text>

    <!-- Subtitle: "— VIZAG —" -->
    <!-- Left Thin Accent Line -->
    <line x1="1" y1="58" x2="42" y2="58" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Tracked VIZAG Text -->
    <text x="76" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#64748B" letter-spacing="4px" text-anchor="middle">
      VIZAG
    </text>

    <!-- Right Thin Accent Line -->
    <line x1="110" y1="58" x2="152" y2="58" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
